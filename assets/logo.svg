<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="520" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d1f3c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="520" height="120" rx="0" fill="url(#bg-grad)"/>
  <!-- Watermark df -->
  <text x="260" y="95" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="120" font-weight="700" fill="#1a2a45" text-anchor="middle" opacity="0.5">df</text>
  <!-- Main text -->
  <text x="260" y="85" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" text-anchor="middle">
    <tspan fill="#ffffff">Dialect</tspan><tspan fill="#00d4ff">Forge</tspan>
  </text>
</svg>
